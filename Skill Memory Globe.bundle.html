  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html lang=\"zh-CN\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>SKILL ORBIT — 技能记忆星球<\u002Ftitle>\n<style>\n  :root{\n    --bg:#000;\n    --ink:#e8e6df;\n    --dim:#7a7468;\n    --line:rgba(232,230,223,0.10);\n    --amber: oklch(0.78 0.13 65);\n    --amber-soft: oklch(0.78 0.13 65 / 0.18);\n    --cyan: oklch(0.82 0.10 200);\n    --cyan-soft: oklch(0.82 0.10 200 / 0.18);\n    --rose: oklch(0.78 0.10 20);\n    --rose-soft: oklch(0.78 0.10 20 / 0.18);\n  }\n  *{box-sizing:border-box;margin:0;padding:0}\n  html,body{height:100%;background:#000;color:var(--ink);overflow:hidden;\n    font-family: \"Inter\", system-ui, sans-serif;\n    -webkit-font-smoothing:antialiased;\n  }\n  canvas{display:block}\n\n  /* ---------- HUD chrome ---------- */\n  .hud{\n    position:fixed; inset:0; pointer-events:none;\n    font-family: \"JetBrains Mono\", ui-monospace, monospace;\n    font-size: 11px;\n    letter-spacing: 0.08em;\n    text-transform: uppercase;\n    color: var(--dim);\n    z-index: 5;\n  }\n  .hud .corner{position:absolute; padding: 22px 28px; line-height: 1.7;}\n  .hud .tl{top:0;left:0}\n  .hud .tr{top:0;right:0;text-align:right}\n  .hud .bl{bottom:0;left:0}\n  .hud .br{bottom:0;right:0;text-align:right}\n\n  .hud .label{color:var(--dim)}\n  .hud .val{color:var(--ink)}\n  .hud .bar{\n    display:inline-block; width: 56px; height:1px; background: var(--line);\n    vertical-align: middle; margin: 0 8px;\n  }\n  .hud .dot{\n    display:inline-block; width:6px;height:6px;border-radius:50%;\n    background: var(--amber); box-shadow: 0 0 10px var(--amber);\n    margin-right: 6px; transform: translateY(-1px);\n  }\n  .hud .brand{\n    font-size: 10px; letter-spacing: 0.32em; color: var(--ink);\n  }\n  .hud .brand b{\n    font-weight:600;\n  }\n  .hud .ticker{\n    position:absolute; left: 50%; top: 28px; transform: translateX(-50%);\n    display:flex; gap: 22px; font-size: 10px; letter-spacing: 0.22em;\n    color: var(--dim);\n  }\n  .hud .ticker span b{color:var(--ink); font-weight:500}\n\n  /* corner crosshair marks */\n  .hud .mark{\n    position:absolute; width: 18px; height: 18px;\n    border:1px solid var(--line);\n  }\n  .hud .mark.tl{top:14px; left:14px; border-right:none; border-bottom:none}\n  .hud .mark.tr{top:14px; right:14px; border-left:none; border-bottom:none}\n  .hud .mark.bl{bottom:14px; left:14px; border-right:none; border-top:none}\n  .hud .mark.br{bottom:14px; right:14px; border-left:none; border-top:none}\n\n  /* ---------- Side panel (left) ---------- */\n  .panel{\n    position:fixed; left: 28px; top: 96px; bottom: 110px;\n    width: 240px; pointer-events:auto;\n    font-family: \"JetBrains Mono\", ui-monospace, monospace;\n    font-size: 11px; color: var(--ink);\n    z-index: 6;\n    display: flex; flex-direction: column;\n    overflow: hidden;\n  }\n  .panel .archive-section{ flex-shrink: 0; }\n  .panel .archive-section .head{\n    display:flex; align-items:center; justify-content:space-between;\n    margin-bottom: 12px;\n  }\n  .panel .archive-section .head h3{ margin-bottom: 0; }\n  .panel .archive-section .toggle{\n    background:transparent; border:1px solid var(--line);\n    color:var(--dim); width:18px; height:18px; line-height:1;\n    font-size:12px; cursor:pointer; border-radius:2px;\n    display:flex; align-items:center; justify-content:center;\n    padding:0; font-family: inherit;\n    transition: color .15s, border-color .15s;\n  }\n  .panel .archive-section .toggle:hover{ color: var(--amber); border-color: var(--amber); }\n  .panel .archive-section .stats-wrap{\n    overflow: hidden;\n    transition: max-height .3s, opacity .25s;\n    max-height: 600px; opacity: 1;\n  }\n  .panel .archive-section.collapsed .stats-wrap{\n    max-height: 0; opacity: 0; pointer-events: none;\n  }\n  .panel .archive-section.collapsed .legend{ display: none; }\n  .panel .recent-section{\n    margin-top: 22px;\n    flex: 1 1 auto;\n    min-height: 0;\n    display: flex; flex-direction: column;\n    border-top: 1px solid var(--line);\n    padding-top: 16px;\n  }\n  .panel .recent-section .head{\n    display:flex; align-items:center; justify-content:space-between;\n    margin-bottom: 10px;\n  }\n  .panel .recent-section .head h3{ margin-bottom: 0; }\n  .panel .recent-section .toggle{\n    background:transparent; border:1px solid var(--line);\n    color:var(--dim); width:18px; height:18px; line-height:1;\n    font-family: \"JetBrains Mono\", ui-monospace, monospace;\n    font-size: 12px; cursor:pointer; border-radius: 2px;\n    display:flex; align-items:center; justify-content:center;\n    padding:0;\n    transition: color .15s, border-color .15s;\n  }\n  .panel .recent-section .toggle:hover{ color: var(--amber); border-color: var(--amber); }\n  .panel .recent-section ul{\n    list-style: none;\n    flex: 1 1 auto;\n    min-height: 0;\n    overflow-y: auto;\n    padding-right: 6px;\n    transition: max-height .3s, opacity .25s;\n  }\n  .panel .recent-section.collapsed ul{\n    max-height: 0; opacity:0; pointer-events:none;\n    flex: 0 0 auto; padding:0;\n  }\n  .panel .recent-section ul::-webkit-scrollbar{width:2px}\n  .panel .recent-section ul::-webkit-scrollbar-thumb{background:var(--line)}\n  .panel .recent-section li{\n    display:flex; align-items:center; gap: 8px;\n    padding: 6px 0; border-top: 1px solid var(--line);\n    color: var(--ink); font-size: 11px;\n    cursor: pointer;\n    transition: color .2s;\n    position: relative;\n  }\n  .panel .recent-section li:hover{color:var(--amber)}\n  .panel .recent-section li .idx{color:var(--dim); font-size:9px; min-width: 22px;}\n  .panel .recent-section li .nm{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}\n  .panel .recent-section li .sw{width:6px;height:6px;border-radius:50%; flex-shrink:0}\n  .panel .recent-section li .note-dot{\n    width:4px; height:4px; border-radius:50%; background: var(--ink);\n    flex-shrink:0; opacity:0.7;\n  }\n  .panel .recent-section li .del{\n    background:transparent; border:0; color:var(--dim);\n    font-size:14px; line-height:1; padding:2px 4px;\n    cursor:pointer; opacity:0;\n    transition: opacity .15s, color .15s;\n    font-family: inherit;\n  }\n  .panel .recent-section li:hover .del{ opacity:1; }\n  .panel .recent-section li .del:hover{ color: var(--rose); }\n  .panel .recent-section.empty{ display: none; }\n\n  /* ---------- detail card (memory node note editor) ---------- */\n  .detail{\n    position: fixed;\n    left: 50%; top: 50%;\n    transform: translate(-50%, -48%) scale(0.96);\n    width: 480px; max-width: calc(100vw - 48px);\n    max-height: 80vh;\n    background: rgba(12,12,14,0.78);\n    backdrop-filter: blur(28px) saturate(140%);\n    -webkit-backdrop-filter: blur(28px) saturate(140%);\n    border: 1px solid var(--line);\n    border-radius: 6px;\n    z-index: 20;\n    opacity: 0; pointer-events: none;\n    transition: opacity .25s ease, transform .25s ease;\n    box-shadow: 0 60px 140px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.02), inset 0 1px 0 rgba(255,255,255,0.05);\n    display: flex; flex-direction: column;\n    overflow: hidden;\n  }\n  .detail.show{\n    opacity: 1; pointer-events: auto;\n    transform: translate(-50%, -50%) scale(1);\n  }\n  .detail header{\n    padding: 22px 24px 18px;\n    border-bottom: 1px solid var(--line);\n    position: relative;\n  }\n  .detail .swatch{\n    position:absolute; top:24px; right:60px;\n    width: 10px; height: 10px; border-radius: 50%;\n    background: var(--amber);\n    box-shadow: 0 0 16px var(--amber);\n  }\n  .detail .close{\n    position:absolute; top:16px; right:16px;\n    background:transparent; border:1px solid var(--line);\n    color: var(--dim); width: 28px; height: 28px;\n    font-family: \"JetBrains Mono\", ui-monospace, monospace;\n    font-size: 14px; cursor: pointer;\n    border-radius: 3px;\n    transition: color .15s, border-color .15s;\n    display:flex; align-items:center; justify-content:center;\n  }\n  .detail .close:hover{ color: var(--ink); border-color: var(--ink); }\n  .detail .head-tag{\n    font-family: \"JetBrains Mono\", ui-monospace, monospace;\n    font-size: 9px; letter-spacing: 0.32em; color: var(--dim);\n    text-transform: uppercase;\n    margin-bottom: 8px;\n  }\n  .detail h2{\n    font-family: \"Inter\", sans-serif;\n    font-size: 22px; font-weight: 500; color: var(--ink);\n    line-height: 1.3;\n    letter-spacing: -0.01em;\n  }\n  .detail .meta{\n    margin-top: 10px;\n    display:flex; gap: 8px; align-items:center;\n    font-family: \"JetBrains Mono\", ui-monospace, monospace;\n    font-size: 10px; letter-spacing: 0.18em; color: var(--dim);\n    text-transform: uppercase;\n  }\n  .detail .meta .sep{ opacity: 0.4 }\n\n  .detail .body{\n    padding: 18px 24px;\n    flex: 1; overflow-y: auto;\n    display:flex; flex-direction:column;\n  }\n  .detail .body label{\n    font-family: \"JetBrains Mono\", ui-monospace, monospace;\n    font-size: 9px; letter-spacing: 0.32em; color: var(--dim);\n    text-transform: uppercase;\n    margin-bottom: 10px;\n  }\n  .detail .body textarea{\n    flex:1; min-height: 200px;\n    background: rgba(0,0,0,0.3);\n    border: 1px solid var(--line);\n    border-radius: 3px;\n    padding: 14px 16px;\n    color: var(--ink);\n    font-family: \"Inter\", sans-serif;\n    font-size: 14px; line-height: 1.65;\n    resize: vertical;\n    outline: none;\n    transition: border-color .15s;\n  }\n  .detail .body textarea:focus{ border-color: rgba(255,176,102,0.4); }\n  .detail .body textarea::placeholder{ color: var(--dim); font-style: italic;}\n\n  .detail footer{\n    padding: 14px 24px;\n    border-top: 1px solid var(--line);\n    display:flex; justify-content:space-between; align-items:center;\n    font-family: \"JetBrains Mono\", ui-monospace, monospace;\n    font-size: 10px; letter-spacing: 0.2em; color: var(--dim);\n    text-transform: uppercase;\n  }\n  .detail footer .hint .key{\
